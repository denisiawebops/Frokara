${money(p.compare-p.price)}</span></div><div class="mt-7"><div class="flex justify-between items-center"><div class="text-sm font-black">Select size</div><button onclick="openSizeGuide()" class="text-xs underline">Size guide</button></div><div class="flex flex-wrap gap-2 mt-3">${SIZES.map(s=>`<button onclick="state.size='${s}';document.querySelectorAll('.sz').forEach(x=>x.classList.remove('bg-[#34252a]','text-white'));this.classList.add('bg-[#34252a]','text-white');" class="sz px-4 py-3 rounded-full border border-[#eadfd9] text-xs font-bold ${state.size===s?'bg-[#34252a] text-white':''}">${s}</button>`).join('')}</div></div><div class="mt-7"><div class="text-sm font-black">Sleeve</div><div class="mt-3 inline-flex items-center gap-2 px-4 py-3 rounded-full bg-[#fff0f4] text-[#a53d5b] text-xs font-bold">${p.sleeve} sleeve</div></div><div class="grid sm:grid-cols-2 gap-3 mt-8"><button onclick="addCart('${p.id}')" class="btn bg-[#34252a] text-white py-4 rounded-full font-bold">Add to bag</button><button onclick="orderWhatsApp('${p.id}')" class="btn bg-[#25D366] text-white py-4 rounded-full font-bold">Order on WhatsApp</button></div><button onclick="toggleWish('${p.id}')" class="w-full mt-3 py-3 rounded-full border border-[#eadfd9] font-bold text-sm">${state.wish.includes(p.id)?'Saved to wishlist ♥':'Save to wishlist ♡'}</button><div class="grid sm:grid-cols-3 gap-3 mt-8"><div class="rounded-2xl border border-[#eadfd9] p-4"><div class="text-[10px] uppercase tracking-[.15em] font-black">Fabric</div><div class="font-bold mt-2">${p.fabric}</div></div><div class="rounded-2xl border border-[#eadfd9] p-4"><div class="text-[10px] uppercase tracking-[.15em] font-black">Fit</div><div class="font-bold mt-2">${p.fit}</div></div><div class="rounded-2xl border border-[#eadfd9] p-4"><div class="text-[10px] uppercase tracking-[.15em] font-black">Color</div><div class="font-bold mt-2">${p.color}</div></div></div></div></div><section class="mt-14 border-t border-[#eadfd9] pt-10"><div class="grid md:grid-cols-2 gap-8"><div><div class="text-[10px] uppercase tracking-[.2em] font-black text-[#a53d5b]">Product story</div><h2 class="serif text-3xl mt-2">A frock with a point of view.</h2><p class="text-stone-600 leading-7 mt-4">${p.desc} Designed to move between Indian textile character and modern day-to-night dressing.</p></div><div><div class="text-[10px] uppercase tracking-[.2em] font-black text-[#a53d5b]">Details</div><div class="grid grid-cols-2 gap-3 mt-4">${p.details.map(d=>`<div class="rounded-2xl bg-[#fff9f5] p-4 text-sm">${d}</div>`).join('')}</div></div></div></section><section class="mt-16"><div class="flex items-end justify-between"><div><div class="text-[10px] uppercase tracking-[.2em] font-black text-[#a53d5b]">Same theme</div><h2 class="serif text-3xl mt-2">Keep the garden going.</h2></div><button onclick="go('/themes')" class="text-sm underline font-bold">See theme</button></div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-6">${same.map(card).join('')}</div></section><section class="mt-14"><div class="text-[10px] uppercase tracking-[.2em] font-black text-[#a53d5b]">Other themes</div><h2 class="serif text-3xl mt-2">A different mood, same DNA.</h2><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mt-6">${other.map(card).join('')}</div></section></div></main>${footer()}`}
function themes(){const list=THEMES.filter(x=>x!=='All');return floralShell(`<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16"><div class="max-w-3xl"><div class="text-[10px] uppercase tracking-[.22em] text-[#a53d5b] font-black">Theme room</div><h1 class="serif text-5xl md:text-6xl mt-2">Dress by mood.</h1><p class="text-stone-600 mt-4 leading-7">Open a theme, then move from one dedicated product story to the next without losing the edit.</p></div><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5 mt-9">${list.map(t=>{const p=PRODUCTS.find(x=>x.theme===t)||PRODUCTS[0];return `<button onclick="state.theme='${t}';go('/shop')" class="text-left card rounded-[2rem] overflow-hidden"><div class="aspect-[4/3] relative"><img src="${p.image}" class="w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"></div><div class="absolute left-5 bottom-5 text-white"><div class="text-[10px] uppercase tracking-[.2em]">Theme</div><div class="serif text-3xl mt-1">${t}</div></div></div><div class="p-5 text-sm text-stone-600">${PRODUCTS.filter(x=>x.theme===t).length} frocks in this edit · Explore →</div></button>`}).join('')}</div></div>`,'Themes','Theme Rooms | FROCKARA','Explore floral, festive, heritage, romantic, minimal, resort, everyday and occasion frocks.')}
function sleeveStudio(){return floralShell(`<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16"><div class="max-w-3xl"><div class="text-[10px] uppercase tracking-[.22em] text-[#a53d5b] font-black">Sleeve Studio</div><h1 class="serif text-5xl md:text-6xl mt-2">Start with the sleeve.</h1><p class="text-stone-600 mt-4 leading-7">A sleeve-first discovery layer that feels more personal than a generic fashion filter.</p></div><div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-9">${SLEEVES.filter(x=>x!=='All').map(s=>`<button onclick="state.sleeve='${s}';go('/shop')" class="rounded-[2rem] border border-[#eadfd9] p-6 bg-white text-left hover:-translate-y-1 transition"><div class="w-14 h-14 rounded-full bg-[#fff0f4] text-[#a53d5b] grid place-items-center font-black">${s[0]}</div><div class="serif text-2xl mt-5">${s}</div><div class="text-xs text-stone-500 mt-1">${PRODUCTS.filter(x=>x.sleeve===s).length} styles</div></button>`).join('')}</div></div>`,'Sleeve Studio','Sleeve Studio | FROCKARA','Shop Indian frocks by sleeve: puff, ruffle, bishop, bell, full, three-quarter and more.')}
function concierge(){return floralShell(`<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 pb-16"><div class="rounded-[2rem] floral-bg border border-[#eadfd9] p-8 md:p-12"><div class="text-[10px] uppercase tracking-[.22em] text-[#a53d5b] font-black">FROCKARA Concierge</div><h1 class="serif text-5xl mt-2">Tell us the moment.</h1><p class="text-stone-600 mt-5 leading-7">Pick occasion, sleeve and budget. We build a small edit and remember the session.</p><form onsubmit="conciergeBuild(event)" class="mt-8 space-y-5"><select name="occasion" class="w-full border border-[#eadfd9] rounded-2xl px-4 py-3"><option>Workday</option><option>Festive</option><option>Wedding guest</option><option>Holiday</option><option>Everyday</option><option>Dinner</option></select><select name="sleeve" class="w-full border border-[#eadfd9] rounded-2xl px-4 py-3">${SLEEVES.filter(x=>x!=='All').map(x=>`<option>${x}</option>`).join('')}</select><select name="budget" class="w-full border border-[#eadfd9] rounded-2xl px-4 py-3"><option>Under 4000</option><option>4000-5000</option><option>5000+</option></select><button class="w-full bg-[#34252a] text-white py-4 rounded-full font-bold">Build my edit</button></form><div id="concierge-result" class="mt-8"></div></div></div>`,'Concierge','Style Concierge | FROCKARA','Personalized Indian frock shortlist by occasion, sleeve and budget.')}
function conciergeBuild(e){e.preventDefault();const f=new FormData(e.target);const a=PRODUCTS.filter(p=>p.sleeve===f.get('sleeve') && ((f.get('budget')==='Under 4000'&&p.price<4000)||(f.get('budget')==='4000-5000'&&p.price>=4000&&p.price<=5000)||(f.get('budget')==='5000+'&&p.price>5000))).slice(0,3);document.getElementById('concierge-result').innerHTML=`<div class="border-t border-[#eadfd9] pt-7"><div class="text-[10px] uppercase tracking-[.2em] font-black text-[#a53d5b]">Your edit</div><div class="grid md:grid-cols-3 gap-4 mt-4">${(a.length?a:PRODUCTS.slice(0,3)).map(card).join('')}</div></div>`;track('concierge_complete',{occasion:f.get('occasion'),sleeve:f.get('sleeve'),budget:f.get('budget')});lucide.createIcons()}
function story(){return floralShell(`<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pb-16"><div class="rounded-[2rem] floral-bg border border-[#eadfd9] p-8 md:p-14"><div class="text-[10px] uppercase tracking-[.22em] text-[#a53d5b] font-black">Our story</div><h1 class="serif text-5xl md:text-6xl mt-2">Indian craft, rearranged around modern life.</h1><p class="text-lg text-stone-600 leading-8 mt-6">FROCKARA is designed as a discovery-first storefront: not just products, but routes through sleeves, themes, fabric and occasion. The same product can become a different story depending on what the customer was looking for.</p><div class="grid md:grid-cols-3 gap-4 mt-10">${[['01','Texture','Handloom-led surfaces and breathable materials.'],['02','Shape','Frocks built around sleeves, movement and easy fit.'],['03','Discovery','Dedicated product pages and related edits keep the journey flowing.']].map(x=>`<div class="rounded-3xl bg-white/80 p-6 border border-white"><div class="text-xs text-[#a53d5b] font-black">${x[0]}</div><div class="serif text-2xl mt-3">${x[1]}</div><p class="text-sm text-stone-600 leading-6 mt-2">${x[2]}</p></div>`).join('')}</div></div></div>`,'Story','Our Story | FROCKARA')+sessionPanel()}
function sessionPanel(){const s=state.session||{};return `<section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pb-16"><div class="border border-[#eadfd9] rounded-3xl p-6"><div class="text-[10px] uppercase tracking-[.2em] font-black">Session intelligence</div><div class="grid sm:grid-cols-3 gap-4 mt-4"><div><div class="text-2xl font-black">${s.pageCount||0}</div><div class="text-xs text-stone-500">Tracked page events</div></div><div><div class="text-2xl font-black">${(s.events||[]).filter(x=>x.name==='view_item').length}</div><div class="text-xs text-stone-500">Product views</div></div><div><div class="text-2xl font-black">${state.account?'Signed in':'Guest session'}</div><div class="text-xs text-stone-500">Account state</div></div></div></div></section>`}
function journal(){return floralShell(`<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16"><div class="max-w-3xl"><div class="text-[10px] uppercase tracking-[.22em] text-[#a53d5b] font-black">Journal</div><h1 class="serif text-5xl md:text-6xl mt-2">Wear the theme, not the trend.</h1><p class="text-stone-600 mt-4">Editorial routes can become SEO/AEO landing pages for every frock, sleeve, fabric and occasion cluster.</p></div><div class="grid md:grid-cols-3 gap-5 mt-9">${[['How to style puff sleeves with Indian prints','Puff sleeves, proportion, jewellery and flats.'],['Choosing a frock by occasion','A practical route from workday to wedding guest.'],['Why floral Indian frocks keep coming back','Print rhythm, craft texture and repeat wear.']].map(x=>`<article class="card rounded-3xl p-6"><div class="text-[10px] uppercase tracking-[.2em] text-[#a53d5b] font-black">FROCKARA Journal</div><h2 class="serif text-2xl mt-4">${x[0]}</h2><p class="text-sm text-stone-600 leading-7 mt-3">${x[1]}</p><button onclick="toast('Editorial CMS endpoint ready for integration.')" class="text-sm font-bold underline mt-4">Read preview →</button></article>`).join('')}</div></div>`,'Journal','Journal | FROCKARA')+''}
function wishlist(){const a=PRODUCTS.filter(p=>state.wish.includes(p.id));return floralShell(`<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-16"><div class="max-w-3xl"><div class="text-[10px] uppercase tracking-[.22em] text-[#a53d5b] font-black">Saved garden</div><h1 class="serif text-5xl mt-2">Your wishlist.</h1></div><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5 mt-8">${a.length?a.map(card).join(''):'<div class="col-span-full rounded-3xl border border-dashed border-[#eadfd9] p-12 text-center text-stone-500">Nothing saved yet. Start with a flower, a sleeve or a mood.</div>'}</div></div>`,'Wishlist','Wishlist | FROCKARA')}
function addCart(id){const p=PRODUCTS.find(x=>x.id===id);const found=state.cart.find(x=>x.id===id&&x.size===state.size);if(found)found.qty++;else state.cart.push({id,size:state.size,qty:1});save();track('add_to_cart',{item_id:id,value:p.price,size:state.size});toast(p.name+' added to bag');openCart()}
function toggleWish(id){const i=state.wish.indexOf(id);if(i>=0)state.wish.splice(i,1);else state.wish.push(id);save();track('wishlist_toggle',{item_id:id,action:i>=0?'remove':'add'});render()}
function cartTotal(){return state.cart.reduce((s,x)=>{const p=PRODUCTS.find(y=>y.id===x.id);return s+p.price*x.qty},0)}
function openCart(){const items=state.cart.map((c,i)=>({c,i,p:PRODUCTS.find(p=>p.id===c.id)}));document.body.insertAdjacentHTML('beforeend',`<aside id="drawer" class="fixed inset-0 z-[90] bg-black/40"><div class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white p-6 flex flex-col"><div class="flex items-center justify-between"><div><div class="text-[10px] uppercase tracking-[.2em] font-black">Your bag</div><div class="text-sm text-stone-500 mt-1">${items.length} line items</div></div><button onclick="document.getElementById('drawer').remove()" class="w-10 h-10 rounded-full border">×</button></div><div class="flex-1 overflow-auto mt-6 space-y-4">${items.length?items.map(x=>`<div class="flex gap-3 border-b border-[#eadfd9] pb-4"><img src="${x.p.image}" class="w-20 h-24 object-cover rounded-2xl"><div class="flex-1"><div class="serif text-xl">${x.p.name}</div><div class="text-xs text-stone-500 mt-1">Size ${x.c.size} · Qty ${x.c.qty}</div><div class="font-black mt-2">${money(x.p.price*x.c.qty)}</div><button onclick="state.cart.splice(${x.i},1);save();document.getElementById('drawer').remove();openCart()" class="text-xs underline mt-2">Remove</button></div></div>`).join(''):'<div class="py-20 text-center text-stone-500">Your bag is empty.</div>'}</div><div class="border-t border-[#eadfd9] pt-5"><div class="flex justify-between font-black text-lg"><span>Total</span><span>${money(cartTotal())}</span></div><button onclick="orderCartWhatsApp()" class="w-full mt-4 bg-[#25D366] text-white py-4 rounded-full font-bold">Place order on WhatsApp</button><button onclick="createOrderDocument('cart')" class="w-full mt-2 border border-[#eadfd9] py-3 rounded-full font-bold">Generate order summary</button></div></div></aside>`);track('view_cart',{items:items.length,value:cartTotal()})}
function buildOrderMessage(id='cart'){let lines=[];if(id==='cart')lines=state.cart.map(c=>{const p=PRODUCTS.find(x=>x.id===c.id);return `• ${p.name} | Size ${c.size} | Qty ${c.qty} | ${money(p.price*c.qty)}`});else{const p=PRODUCTS.find(x=>x.id===id);lines=[`• ${p.name} | Size ${state.size} | Qty 1 | ${money(p.price)}`]}const total=id==='cart'?cartTotal():PRODUCTS.find(p=>p.id===id).price;const orderId='FRK-'+Date.now().toString().slice(-7);return {orderId,text:[`Hello FROCKARA 👋`,`Order request: ${orderId}`,'',...lines,'',`Total: ${money(total)}`,'Payment / order confirmation can be completed over WhatsApp.','Payment contact: '+PAYMENT_NUMBER+'\nPlease share delivery details and confirm payment before fulfilment.','I am ordering from the FROCKARA website.'].join('\n')}}
function orderWhatsApp(id){const o=buildOrderMessage(id);track('whatsapp_order_start',{order_id:o.orderId,product_id:id,value:PRODUCTS.find(p=>p.id===id).price});save();location.href='https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(o.text)}
function orderCartWhatsApp(){const o=buildOrderMessage('cart');track('whatsapp_order_start',{order_id:o.orderId,value:cartTotal(),items:state.cart.length});location.href='https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(o.text)}
function createOrderDocument(id='cart'){const o=buildOrderMessage(id);const items=id==='cart'?state.cart.map(c=>{const p=PRODUCTS.find(x=>x.id===c.id);return {name:p.name,size:c.size,qty:c.qty,price:p.price,theme:p.theme,sleeve:p.sleeve}}):(()=>{const p=PRODUCTS.find(x=>x.id===id);return [{name:p.name,size:state.size,qty:1,price:p.price,theme:p.theme,sleeve:p.sleeve}]})();const html='<!doctype html><html><head><meta charset="utf-8"><title>'+o.orderId+' · FROCKARA</title><style>body{font-family:Arial,sans-serif;max-width:720px;margin:40px auto;padding:20px;color:#34252a}h1{font-family:Georgia,serif}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}</style></head><body><h1>FROCKARA Order Summary</h1><p><strong>'+o.orderId+'</strong></p><table><thead><tr><th>Product</th><th>Size</th><th>Qty</th><th>Amount</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+x.name+'</td><td>'+x.size+'</td><td>'+x.qty+'</td><td>'+money(x.price*x.qty)+'</td></tr>').join('')+'</tbody></table><h2>Total: '+money(id==='cart'?cartTotal():items[0].price)+'</h2><p>WhatsApp ordering: +91 83175 81308</p><p>Payment contact: '+PAYMENT_NUMBER+'</p></body></html>';const json=JSON.stringify({orderId:o.orderId,items,total:id==='cart'?cartTotal():items[0].price,paymentContact:PAYMENT_NUMBER,whatsapp:WA_NUMBER},null,2);for(const [body,name,type] of [[html,o.orderId+'-order-summary.html','text/html'],[json,o.orderId+'-order.json','application/json']]){const blob=new Blob([body],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}track('order_document_generated',{order_id:o.orderId})}
function openSizeGuide(){document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="fixed inset-0 z-[95] bg-black/40 grid place-items-center p-4" onclick="this.remove()"><div class="bg-white max-w-2xl w-full rounded-3xl p-6" onclick="event.stopPropagation()"><div class="flex items-center justify-between"><div class="serif text-3xl">Size guide</div><button onclick="document.getElementById('modal').remove()" class="w-10 h-10 rounded-full border">×</button></div><div class="overflow-auto mt-5"><table class="w-full text-sm"><thead><tr class="border-b"><th class="text-left py-3">Size</th><th class="text-left">Bust (in)</th><th class="text-left">Waist (in)</th><th class="text-left">Hip (in)</th></tr></thead><tbody>${[['XS','32','26','34'],['S','34','28','36'],['M','36','30','38'],['L','38','33','40'],['XL','40','36','42'],['XXL','42','39','44']].map(r=>`<tr class="border-b"><td class="py-3 font-bold">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div><p class="text-xs text-stone-500 mt-4">Use body measurements in inches. Final product allowance and silhouette vary by style.</p></div></div>`);track('size_guide_open')}
function openAccount(){const signed=!!state.account;document.body.insertAdjacentHTML('beforeend',`<div id="accountModal" class="fixed inset-0 z-[96] bg-black/40 grid place-items-center p-4" onclick="this.remove()"><div class="bg-white max-w-md w-full rounded-3xl p-7" onclick="event.stopPropagation()">${signed?`<div class="text-[10px] uppercase tracking-[.2em] font-black text-[#a53d5b]">Your FROCKARA account</div><div class="serif text-3xl mt-2">${state.account.name||'Guest shopper'}</div><p class="text-sm text-stone-500 mt-2">${state.account.email||''}</p><div class="grid grid-cols-2 gap-3 mt-6"><div class="rounded-2xl bg-[#fff9f5] p-4"><div class="text-2xl font-black">${state.wish.length}</div><div class="text-xs text-stone-500">Saved pieces</div></div><div class="rounded-2xl bg-[#fff9f5] p-4"><div class="text-2xl font-black">${(state.session.events||[]).filter(x=>x.name==='view_item').length}</div><div class="text-xs text-stone-500">Product views</div></div></div><button onclick="state.account=null;save();document.getElementById('accountModal').remove();render()" class="w-full mt-6 border border-[#eadfd9] py-3 rounded-full font-bold">Sign out</button>`:`<div class="text-[10px] uppercase tracking-[.2em] font-black text-[#a53d5b]">Welcome to FROCKARA</div><div class="serif text-4xl mt-2">Keep your garden saved.</div><p class="text-sm text-stone-600 leading-6 mt-4">Sign in with Google to keep your wishlist, session history and order journey connected.</p><div id="googleBtn" class="mt-6 flex justify-center"></div><button onclick="demoGoogleSignIn()" class="w-full mt-3 bg-white border border-[#eadfd9] py-3 rounded-full font-bold text-sm">Use prototype Google account</button><div class="text-[11px] text-stone-500 mt-4">Production: replace demo sign-in with Google Identity Services using your OAuth client ID and backend token verification.</div>`}</div></div>`);track('account_open',{signed_in:signed});setTimeout(initGoogle,50)}
function handleGoogleCredential(response){try{const raw=response.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');const payload=JSON.parse(atob(raw));state.account={name:payload.name||'Google shopper',email:payload.email||'',picture:payload.picture||'',provider:'google',createdAt:new Date().toISOString()};state.session.accountCreatedAt=state.session.accountCreatedAt||new Date().toISOString();save();track('login',{method:'Google'});document.getElementById('accountModal')?.remove();toast('Google account connected');render()}catch(e){toast('Google response verification failed in prototype')}}
function initGoogle(){if(window.google?.accounts?.id&&GOOGLE_CLIENT_ID&&!GOOGLE_CLIENT_ID.startsWith('YOUR_')){google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleGoogleCredential});const el=document.getElementById('googleBtn');if(el)google.accounts.id.renderButton(el,{theme:'outline',size:'large',width:320,text:'continue_with'})}}
function demoGoogleSignIn(){state.account={name:'FROCKARA Guest',email:'google-user@example.com',provider:'google-demo',createdAt:new Date().toISOString()};state.session.accountCreatedAt=state.session.accountCreatedAt||new Date().toISOString();save();track('login',{method:'Google'});document.getElementById('accountModal')?.remove();toast('Google-ready demo account created');render()}
function quick(id){const p=PRODUCTS.find(x=>x.id===id);document.body.insertAdjacentHTML('beforeend',`<div id="qv" class="fixed inset-0 z-[94] bg-black/40 grid place-items-center p-4" onclick="this.remove()"><div class="bg-white rounded-[2rem] max-w-4xl w-full overflow-hidden" onclick="event.stopPropagation()"><div class="grid md:grid-cols-2"><img src="${p.image}" alt="${p.name}" class="w-full h-full min-h-80 object-cover"><div class="p-7"><button onclick="document.getElementById('qv').remove()" class="float-right w-10 h-10 rounded-full border">×</button><div class="text-[10px] uppercase tracking-[.2em] text-[#a53d5b] font-black">${p.theme}</div><h2 class="serif text-4xl mt-3">${p.name}</h2><p class="text-sm text-stone-600 leading-7 mt-4">${p.desc}</p><div class="font-black text-2xl mt-5">${money(p.price)}</div><div class="grid grid-cols-2 gap-2 mt-6"><button onclick="addCart('${p.id}');document.getElementById('qv').remove()" class="bg-[#34252a] text-white py-3 rounded-full font-bold">Add to bag</button><button onclick="document.getElementById('qv').remove();go('/product/${p.id}')" class="border border-[#34252a] py-3 rounded-full font-bold">Open page</button></div></div></div></div></div>`);track('quick_view',{item_id:id})}
function openSearch(){document.body.insertAdjacentHTML('beforeend',`<div id="searchModal" class="fixed inset-0 z-[97] bg-black/40 flex justify-center pt-24 p-4" onclick="this.remove()"><div class="bg-white rounded-3xl w-full max-w-2xl p-5 h-max" onclick="event.stopPropagation()"><div class="flex gap-2"><input autofocus id="searchInput" oninput="searchSuggest()" class="flex-1 border border-[#eadfd9] rounded-full px-4 py-3" placeholder="Search floral, puff, festive, handloom…"><button onclick="document.getElementById('searchModal').remove()" class="w-12 rounded-full border">×</button></div><div id="searchResults" class="mt-4"></div></div></div>`);track('search_open')}
function searchSuggest(){const q=(document.getElementById('searchInput').value||'').toLowerCase();const a=PRODUCTS.filter(p=>(p.name+' '+p.theme+' '+p.sleeve+' '+p.fabric+' '+p.occasion).toLowerCase().includes(q)).slice(0,6);document.getElementById('searchResults').innerHTML=a.map(p=>`<button onclick="document.getElementById('searchModal').remove();go('/product/${p.id}')" class="w-full flex items-center gap-3 p-2 rounded-2xl hover:bg-[#fff9f5] text-left"><img src="${p.image}" class="w-14 h-16 object-cover rounded-xl"><span><span class="block serif text-lg">${p.name}</span><span class="block text-xs text-stone-500">${p.theme} · ${p.sleeve} sleeve · ${money(p.price)}</span></span></button>`).join('')||'<div class="py-10 text-center text-sm text-stone-500">No matching frock yet.</div>'}
function render(){const r=parseRoute();const view=r.path==='product'?product(r.id):({'home':home,'shop':shop,'themes':themes,'sleeve-studio':sleeveStudio,'concierge':concierge,'story':story,'journal':journal,'wishlist':wishlist}[r.path]||home);document.getElementById('app').innerHTML=view;lucide.createIcons();track('page_view',{route:r.path,product:r.id||''});if(r.path==='product'&&r.id)track('view_item',{item_id:r.id});window.scrollTo({top:0,behavior:'instant'})}
window.addEventListener('DOMContentLoaded',()=>{if(!state.session.id)state.session={id:crypto.randomUUID?.()||String(Date.now()),startedAt:new Date().toISOString(),pageCount:0,events:[]};save();render();});
</script>
</body></html>
